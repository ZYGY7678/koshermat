<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>כושרמט — התחברות</title><link rel="stylesheet" href="css/style.css?v=37"></head><body>
<div class="center-page page-enter"><div class="card" style="width:100%;max-width:420px"><div class="text-center mt-1" style="margin-bottom:22px"><div style="font-size:44px">♞</div><div class="brand-text" style="font-size:26px;font-weight:900">כושרמט</div><div class="muted" style="font-size:14px">שחמט. תחרות. קהילה.</div></div>
<div class="section-title text-center" style="margin-bottom:18px">התחברות לחשבון</div>
<form id="form-login" class="flex flex-col gap-1"><div><label>אימייל</label><input type="email" id="login-email" required placeholder="you@example.com"></div><div><label>סיסמה</label><input type="password" id="login-password" required minlength="6" placeholder="••••••••"></div><button type="submit" class="btn btn-primary btn-block mt-1">התחבר</button></form>
<div class="text-center mt-2"><a href="javascript:void(0)" id="forgot-password-link" class="linklike" style="font-size:13px">שכחת סיסמה?</a></div>
<div class="text-center mt-2" style="padding-top:16px;border-top:1px solid var(--border)"><div class="muted" style="font-size:13px;margin-bottom:8px">אין לך עדיין חשבון?</div><a href="signup.html" class="btn btn-accent btn-block">הרשמה</a></div>
<p class="text-center mt-2"><a href="emergency-access.html" class="linklike" style="font-size:12px">כניסה למורשים</a></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://ibzlbpbsqyfpmwomxbgm.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_mtYSf_WBf9xsDQKa0BsP8Q_-o9TsNVg";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
function toast(m,t=""){let c=document.getElementById("toast-container");if(!c){c=document.createElement("div");c.id="toast-container";document.body.appendChild(c)}let e=document.createElement("div");e.className=`toast ${t}`;e.textContent=m;c.appendChild(e);setTimeout(()=>e.remove(),4500)}
(async()=>{const{data:{session}}=await sb.auth.getSession();if(session)location.href="lobby.html"})();
document.getElementById("form-login").addEventListener("submit",async e=>{e.preventDefault();const b=e.currentTarget.querySelector("button[type=submit]"),email=document.getElementById("login-email").value.trim(),password=document.getElementById("login-password").value;b.disabled=true;b.textContent="מתחבר...";try{const{error}=await sb.auth.signInWithPassword({email,password});if(error){toast("שגיאה בהתחברות: "+error.message,"error");b.disabled=false;b.textContent="התחבר";return}location.href="lobby.html"}catch(err){toast("שגיאה בחיבור לשרת: "+(err?.message||String(err)),"error");b.disabled=false;b.textContent="התחבר"}});
document.getElementById("forgot-password-link").addEventListener("click",async()=>{const email=document.getElementById("login-email").value.trim();if(!email){toast("הזן קודם את כתובת האימייל שלך","error");return}const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/reset-password.html"});toast(error?"שגיאה: "+error.message:"נשלח מייל לאיפוס סיסמה","success")});
</script></body></html>
